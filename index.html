<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Tracker</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            tarkov: {
              gold: '#c2a649',
              dark: '#121212',
              cardDark: '#1e1e1e',
              borderDark: '#333333'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* 全局預設禁止文字反白選擇（除可複製名稱外） */
    * {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    /* 允許標題文字自由選取 */
    .selectable-text {
      -webkit-user-select: text !important;
      -moz-user-select: text !important;
      -ms-user-select: text !important;
      user-select: text !important;
    }

    /* 移除 input number 的微調箭頭預設邊距 */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    /* 共同地圖高亮特效：金色發光 */
    .map-highlight {
      background-color: rgba(245, 158, 11, 0.35) !important;
      border-color: #f59e0b !important;
      color: #ffffff !important;
      font-weight: 900 !important;
      letter-spacing: 0.025em;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.7);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8), 0 0 6px rgba(245, 158, 11, 0.8);
      transform: scale(1.02);
    }
    .dark .map-highlight {
      background-color: rgba(245, 158, 11, 0.4) !important;
      border-color: #fbbf24 !important;
      color: #fffbeb !important;
      font-weight: 900 !important;
      letter-spacing: 0.025em;
      box-shadow: 0 0 14px rgba(251, 191, 36, 0.75);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 8px rgba(251, 191, 36, 0.9);
      transform: scale(1.02);
    }

    /* 點擊選擇的地圖綠色高光特效 */
    .map-green-highlight {
      background-color: rgba(16, 185, 129, 0.35) !important;
      border-color: #10b981 !important;
      color: #ffffff !important;
      font-weight: 900 !important;
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.8) !important;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 8px rgba(16, 185, 129, 0.9) !important;
      transform: scale(1.03);
    }

    /* 滑鼠懸停同步地圖特效 */
    .map-hover-active {
      background-color: rgba(6, 182, 212, 0.35) !important;
      border-color: #06b6d4 !important;
      color: #ffffff !important;
      font-weight: 900 !important;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.8) !important;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8), 0 0 6px rgba(6, 182, 212, 0.8) !important;
    }

    /* 自訂平滑滾動條 */
    .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(16, 185, 129, 0.4);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(16, 185, 129, 0.7);
    }

    /* COMPLETE 達標彈出橫幅動畫 (移除模糊，文字展開後持續 2.5 秒) */
    @keyframes completeBanner {
      0% {
        transform: translateY(-50%) scaleX(0);
        opacity: 0;
      }
      10% {
        transform: translateY(-50%) scaleX(1);
        opacity: 1;
      }
      85% {
        transform: translateY(-50%) scaleX(1);
        opacity: 1;
      }
      100% {
        transform: translateY(-50%) scaleX(1.15);
        opacity: 0;
      }
    }

    @keyframes popTextAnim {
      0% {
        transform: scale(0.1);
        opacity: 0;
      }
      8% {
        transform: scale(1.35);
        opacity: 1;
      }
      14% {
        transform: scale(1);
        opacity: 1;
      }
      /* 14% (約 0.5 秒) 至 85% (約 3.0 秒) 為完全展開顯示階段，剛好持續 2.5 秒 */
      85% {
        transform: scale(1);
        opacity: 1;
      }
      92% {
        transform: scale(1.08) skewX(-12deg);
        opacity: 0.8;
      }
      100% {
        transform: scale(1.2) skewX(20deg);
        opacity: 0;
      }
    }

      animation: completeBanner 3.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

  <script>
    // 8 個文件資料設定（名稱與地圖名稱保持原樣不修改）
    const itemsData = [
      { id: 1, title: "Financial", img: "https://i.ibb.co/GQ8XpwQF/f.png", maps: ["Customs", "Streets of Tarkov", "Interchange"] },
      { id: 2, title: "PMC personnel", img: "https://i.ibb.co/7t4drvqB/pmc.png", maps: ["Reserve", "Lighthouse", "Icebreaker"] },
      { id: 3, title: "Project", img: "https://i.ibb.co/RkXzBvk5/PROJECT.png", maps: ["Factory", "Reserve", "Customs"] },
      { id: 4, title: "Blueprint", img: "https://i.ibb.co/wbM8JJv/B.png", maps: ["Interchange", "The Labyrinth", "Factory"] },
      { id: 5, title: "Test", img: "https://i.ibb.co/991TzPWw/TEST.png", maps: ["Shoreline", "Woods", "Icebreaker"] },
      { id: 6, title: "User", img: "https://i.ibb.co/5gqM3xyf/USER.png", maps: ["Streets of Tarkov", "Ground Zero", "The Lab"] },
      { id: 7, title: "MED", img: "https://i.ibb.co/MkLgPtCK/MED.png", maps: ["The Lab", "Ground Zero", "The Labyrinth"] },
      { id: 8, title: "Tec", img: "https://i.ibb.co/ns1fwwjd/TEC.png", maps: ["Shoreline", "Woods", "Lighthouse"] }
    ];

    // 多語言對照辭典 (地圖名稱與文件名稱維持英文)
    const i18n = {
      zh: {
        autoSave: "💾 自動記憶",
        subTitle: "點擊文件名稱可複製 | 點擊卡片地圖建立單向轉移路線",
        clearRoute: "清空轉移路線",
        resetAll: "重置所有數量",
        transitTitle: "🗺️ 地圖單向轉移串聯路線",
        noMapSelected: "未選擇地圖",
        noRouteBuilt: "尚未建立路線",
        undoStep: "↩ 撤銷上一步",
        transitHint: "提示：點擊卡片下方地圖標籤即可加入路線",
        emptyRouteGuide: "👈 請點擊下方卡片中的任何地圖標籤（例如 Customs, Factory...），以組合單向轉移路線",
        canTransit: "可轉移",
        cannotTransit: "無法轉移",
        startPrefix: "起點",
        selectNextStop: "(請選擇下一站)",
        validRoute: "✅ 完整路線合法",
        transitsCount: "次轉移",
        invalidRoutePrefix: "❌ 包含",
        invalidRouteSuffix: "個無效轉移",
        sharedTargetsTitle: "共同目標地圖 (Shared Targets)",
        itemsCount: "個項目",
        copiedToast: "已複製名稱：",
        clickToRemoveNode: "點擊即可移除此節點",
        clickToCopy: "點擊複製名稱：",
        zeroTitle: "歸零",
        langBtnText: "English",
        targetLabel: "目標",
        foundLabel: "已拾"
      },
      en: {
        autoSave: "💾 Auto Saved",
        subTitle: "Click title to copy | Click map tag to build transit route",
        clearRoute: "Clear Transit Route",
        resetAll: "Reset All Counts",
        transitTitle: "🗺️ Map Transit Route Flow",
        noMapSelected: "No Map Selected",
        noRouteBuilt: "No Route Built",
        undoStep: "↩ Undo Step",
        transitHint: "Hint: Click map tags below to add to route",
        emptyRouteGuide: "👈 Click map tags on cards below (e.g. Customs, Factory...) to build transit route",
        canTransit: "Valid",
        cannotTransit: "Invalid",
        startPrefix: "Start",
        selectNextStop: "(Select next stop)",
        validRoute: "✅ Valid Route",
        transitsCount: "transits",
        invalidRoutePrefix: "❌ Contains",
        invalidRouteSuffix: "invalid transit(s)",
        sharedTargetsTitle: "Shared Targets",
        itemsCount: "items",
        copiedToast: "Copied name: ",
        clickToRemoveNode: "Click to remove node",
        clickToCopy: "Click to copy name: ",
        zeroTitle: "Reset to 0",
        langBtnText: "繁體中文",
        targetLabel: "Req",
        foundLabel: "Found"
      }
    };

    let currentLang = 'zh';

    // 地圖合法轉移圖 (Valid Transit Adjacency Map)
    const VALID_TRANSITS = {
      "Ground Zero": ["Streets of Tarkov"],
      "Streets of Tarkov": ["Ground Zero", "Interchange", "The Lab"],
      "The Lab": ["Streets of Tarkov"],
      "Interchange": ["Streets of Tarkov", "Customs"],
      "Customs": ["Interchange", "Factory", "Reserve", "Shoreline"],
      "Factory": ["Customs", "Woods", "The Lab"],
      "Woods": ["Factory", "Reserve", "Customs"],
      "Reserve": ["Customs", "Woods", "Lighthouse"],
      "Lighthouse": ["Shoreline"],
      "Shoreline": ["Lighthouse", "Icebreaker", "The Labyrinth"],
      "Icebreaker": [],
      "The Labyrinth": []
    };

    const counts = new Array(itemsData.length).fill(0);
    const foundCounts = new Array(itemsData.length).fill(0);
    let transitPath = [];
    
    // 紀錄各卡片上一狀態與動畫過期時間，確保已拾取大於目標或連續操作時動畫不被中斷
    const lastCompletedState = new Array(itemsData.length).fill(false);
    const completionAnimExpiry = new Array(itemsData.length).fill(0);
    const animTimeouts = new Array(itemsData.length).fill(null);
    let isInitialRender = true;

    const STORAGE_KEY = 'tarkov_doc_tracker_state';

    // 儲存狀態至記憶體 (Save state including language)
    function saveState() {
      try {
        const state = {
          counts: counts,
          foundCounts: foundCounts,
          transitPath: transitPath,
          currentLang: currentLang
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn('無法寫入 LocalStorage 記憶區', e);
      }
    }

    // 從記憶體載入狀態 (Load state)
    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed.counts) && parsed.counts.length === itemsData.length) {
            for (let i = 0; i < counts.length; i++) {
              counts[i] = typeof parsed.counts[i] === 'number' ? parsed.counts[i] : 0;
            }
          }
          if (Array.isArray(parsed.foundCounts) && parsed.foundCounts.length === itemsData.length) {
            for (let i = 0; i < foundCounts.length; i++) {
              foundCounts[i] = typeof parsed.foundCounts[i] === 'number' ? parsed.foundCounts[i] : 0;
            }
          }
          if (Array.isArray(parsed.transitPath)) {
            transitPath = parsed.transitPath;
          }
          if (parsed.currentLang && (parsed.currentLang === 'zh' || parsed.currentLang === 'en')) {
            currentLang = parsed.currentLang;
          }
        }
      } catch (e) {
        console.warn('讀取 LocalStorage 失敗', e);
      }
    }

    // 切換語言
    function toggleLanguage() {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      applyLanguage();
      renderCards();
    }

    // 將語言字典替換至介面標籤中
    function applyLanguage() {
      const dict = i18n[currentLang];

      // 更新具備 data-i18n 屬性的靜態 HTML 文字
      document.querySelectorAll('[data-i18n]').forEach(elem => {
        const key = elem.getAttribute('data-i18n');
        if (dict[key]) {
          elem.innerText = dict[key];
        }
      });

      // 更新特定標籤
      const langBtnText = document.getElementById('lang-btn-text');
      if (langBtnText) langBtnText.innerText = dict.langBtnText;

      saveState();
    }

    // 複製名稱至剪貼簿
    function copyTitleText(titleText, event) {
      if (event) event.stopPropagation();
      
      const tempInput = document.createElement("input");
      tempInput.value = titleText;
      document.body.appendChild(tempInput);
      tempInput.select();
      
      try {
        document.execCommand("copy");
        showToast(`${i18n[currentLang].copiedToast}「${titleText}」`);
      } catch (err) {
        console.error("複製失敗", err);
      } finally {
        document.body.removeChild(tempInput);
      }
    }

    // 顯示 Toast 提示
    let toastTimeout = null;
    function showToast(message) {
      const toast = document.getElementById('toast-notification');
      const msgElem = document.getElementById('toast-message');
      
      msgElem.innerText = message;
      toast.classList.remove('opacity-0', 'translate-y-4');
      toast.classList.add('opacity-100', 'translate-y-0');

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-4');
      }, 2000);
    }

    // 渲染卡片
    function renderCards() {
      const dict = i18n[currentLang];
      const container = document.getElementById('grid-container');
      container.innerHTML = '';

      itemsData.forEach((item, index) => {
        const count = counts[index];
        const foundCount = foundCounts[index];
        const isActive = count > 0;
        const isCompleted = count > 0 && foundCount >= count;

        // 當從未完成變為完成時，觸發 3.5 秒完整動畫計時，防止在已拾取大於目標時中斷動畫
        if (!isInitialRender && isCompleted && !lastCompletedState[index]) {
          completionAnimExpiry[index] = Date.now() + 3500;
          if (animTimeouts[index]) clearTimeout(animTimeouts[index]);
          animTimeouts[index] = setTimeout(() => {
            renderCards();
          }, 3500);
        }
        
        // 若數量降至未完成，重置動畫狀態
        if (!isCompleted) {
          completionAnimExpiry[index] = 0;
          if (animTimeouts[index]) {
            clearTimeout(animTimeouts[index]);
            animTimeouts[index] = null;
          }
        }

        lastCompletedState[index] = isCompleted;

        const now = Date.now();
        const isAnimating = isCompleted && completionAnimExpiry[index] > now;
        const elapsedSec = isAnimating ? ((3500 - (completionAnimExpiry[index] - now)) / 1000).toFixed(2) : 0;
        const animDelayStyle = isAnimating ? `style="animation-delay: -${elapsedSec}s;"` : '';

        let cardStyleClass = 'border-slate-200 dark:border-zinc-800';
        if (isCompleted) {
          cardStyleClass = 'border-emerald-500 bg-emerald-500/10 dark:bg-emerald-950/30 shadow-lg shadow-emerald-500/20 ring-2 ring-emerald-500/50';
        } else if (isActive) {
          cardStyleClass = 'border-amber-500 shadow-md shadow-amber-500/10';
        }

        const card = document.createElement('div');
        card.className = `relative overflow-hidden flex flex-col bg-white dark:bg-zinc-900 border ${cardStyleClass} rounded-2xl p-4 transition-all duration-200 hover:border-amber-500/50`;

        card.innerHTML = `
          <!-- 延伸至整個卡片兩側邊緣的 COMPLETE 彈出與黑白亂碼閃爍橫幅 (支援無縫平滑播放) -->
          ${isAnimating ? `
            <div class="animate-complete-banner absolute inset-x-0 top-1/2 -translate-y-1/2 z-30 pointer-events-none py-3 bg-zinc-950/95 shadow-[0_0_30px_rgba(16,185,129,0.6)] flex items-center justify-center overflow-hidden" ${animDelayStyle}>
              <!-- 隨機高密度精細黑白閃爍亂碼塊層 (12 層小方塊與碎片) -->
              <div class="glitch-block gb-1" ${animDelayStyle}></div>
              <div class="glitch-block gb-2" ${animDelayStyle}></div>
              <div class="glitch-block gb-3" ${animDelayStyle}></div>
              <div class="glitch-block gb-4" ${animDelayStyle}></div>
              <div class="glitch-block gb-5" ${animDelayStyle}></div>
              <div class="glitch-block gb-6" ${animDelayStyle}></div>
              <div class="glitch-block gb-7" ${animDelayStyle}></div>
              <div class="glitch-block gb-8" ${animDelayStyle}></div>
              <div class="glitch-block gb-9" ${animDelayStyle}></div>
              <div class="glitch-block gb-10" ${animDelayStyle}></div>
              <div class="glitch-block gb-11" ${animDelayStyle}></div>
              <div class="glitch-block gb-12" ${animDelayStyle}></div>
              
              <!-- 彈出文字與賽博玻璃折射區 -->
              <div class="animate-pop-text relative z-10 flex items-center justify-center select-none" ${animDelayStyle}>
                <!-- 基底主文字 -->
                <span class="font-black text-lg sm:text-xl tracking-widest text-emerald-400 drop-shadow-[0_0_12px_rgba(52,211,153,0.9)] uppercase">
                   COMPLETE 
                </span>

                <!-- 賽博玻璃折射與區域隨機縮放切片 (Cyber Refraction Glitch Slices) -->
                <span class="cyber-refract-slice refract-1 font-black text-lg sm:text-xl tracking-widest text-emerald-300 uppercase" ${animDelayStyle}>★ COMPLETE ★</span>
                <span class="cyber-refract-slice refract-2 font-black text-lg sm:text-xl tracking-widest text-emerald-200 uppercase" ${animDelayStyle}>★ COMPLETE ★</span>
                <span class="cyber-refract-slice refract-3 font-black text-lg sm:text-xl tracking-widest text-teal-300 uppercase" ${animDelayStyle}>★ COMPLETE ★</span>
                <span class="cyber-refract-slice refract-4 font-black text-lg sm:text-xl tracking-widest text-emerald-400 uppercase" ${animDelayStyle}>★ COMPLETE ★</span>
                <span class="cyber-refract-slice refract-5 font-black text-lg sm:text-xl tracking-widest text-emerald-300 uppercase" ${animDelayStyle}>★ COMPLETE ★</span>
              </div>
            </div>
          ` : ''}

          <!-- 可複製/可劃詞選取的文件標題 -->
          <div class="mb-2 text-center flex items-center justify-center gap-1.5 group/title cursor-pointer py-0.5 px-1 rounded-lg hover:bg-amber-500/10 transition-colors"
               onclick="copyTitleText('${item.title}', event)" 
               title="${dict.clickToCopy}${item.title}">
            <span class="selectable-text font-bold text-base truncate text-slate-800 dark:text-zinc-200 group-hover/title:text-amber-500 transition-colors">
              ${item.title}
            </span>
            <svg class="w-3.5 h-3.5 opacity-40 group-hover/title:opacity-100 text-amber-500 transition-opacity shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 012-2v-8a2 2 0 01-2 2v8a2 2 0 012 2z"/>
            </svg>
          </div>

          <!-- 正方形按鈕圖片區 (單個方塊縮小與優化比例) -->
          <div class="relative w-full max-w-[200px] mx-auto aspect-square mb-3 rounded-xl overflow-hidden cursor-pointer border-2 ${isCompleted ? 'border-emerald-500' : (isActive ? 'border-amber-500' : 'border-transparent')} transition-all group" onclick="handleSquareClick(${index})">
            <img src="${item.img}" alt="${item.title}" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" onerror="this.src='https://via.placeholder.com/300?text=${encodeURIComponent(item.title)}'" />
            <div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-colors"></div>

            <!-- 右下角數量提示標籤（僅在 count > 0 時顯示，未選取/count=0 時自動隱藏） -->
            ${isCompleted ? `
              <div class="absolute bottom-2 right-2 bg-emerald-500 text-zinc-950 font-black text-xs px-2.5 py-0.5 rounded-full flex items-center justify-center shadow-lg border border-zinc-950/20 gap-1 animate-pulse">
                ✓ x${foundCount}/${count}
              </div>
            ` : (isActive ? `
              <div class="absolute bottom-2 right-2 bg-amber-500 text-zinc-950 font-black text-xs px-2 py-0.5 rounded-full flex items-center justify-center shadow-lg border border-zinc-950/20 animate-bounce-short">
                x${foundCount > 0 ? `${foundCount}/${count}` : count}
              </div>
            ` : '')}
          </div>

          <!-- 註解區：分三列垂直顯示地圖名稱 -->
          <div class="flex flex-col gap-1.5 mb-3 flex-grow">
            ${item.maps.map(map => {
              const matchingIndices = transitPath
                .map((m, idx) => m === map ? idx + 1 : null)
                .filter(idx => idx !== null);
              const isSelectedInPath = matchingIndices.length > 0;
              const badgeNum = isSelectedInPath ? `<span class="bg-emerald-950/40 text-emerald-200 px-1.5 py-0.2 rounded text-[10px] mr-1 font-black">#${matchingIndices.join(', #')}</span>` : '';

              return `
                <div class="map-tag cursor-pointer text-xs py-1.5 px-2.5 rounded-lg border border-slate-200 dark:border-zinc-800 bg-slate-50 dark:bg-zinc-800/50 text-slate-600 dark:text-zinc-400 text-center font-semibold transition-all flex items-center justify-center select-none hover:border-emerald-400/80 ${isSelectedInPath ? 'map-green-highlight' : ''}" 
                     data-map="${map}" 
                     onclick="toggleMapTransit('${map}', event)"
                     onmouseenter="hoverMap('${map}')" 
                     onmouseleave="unhoverMap()">
                  ${badgeNum}${map}
                </div>
              `;
            }).join('')}
          </div>

          <!-- 控制器區域：僅在目標需求數量 > 0 時顯示 -->
          ${isActive ? `
            <div class="flex flex-col gap-1.5 mt-auto">
              <!-- 上排：目標需求數量控制器 -->
              <div class="flex items-center justify-between w-full bg-slate-100 dark:bg-zinc-800/80 rounded-xl p-1 border border-slate-200 dark:border-zinc-700/60">
                <span class="text-[10px] font-black text-amber-600 dark:text-amber-400 pl-1 select-none">${dict.targetLabel}</span>
                <div class="flex items-center gap-1">
                  <button onclick="zeroCount(${index}, event)" class="w-6 h-6 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-600 dark:text-red-400 font-bold flex items-center justify-center transition-colors text-xs" title="${dict.zeroTitle}">
                    ↺
                  </button>
                  <button onclick="decrement(${index}, event)" class="w-6 h-6 rounded-lg bg-white dark:bg-zinc-700 hover:bg-slate-200 dark:hover:bg-zinc-600 text-slate-700 dark:text-zinc-200 font-bold flex items-center justify-center shadow-sm transition-colors text-xs">
                    -
                  </button>
                  <input 
                    type="number" 
                    min="0"
                    max="999"
                    value="${count}" 
                    onchange="handleInputChange(${index}, this.value)"
                    onkeydown="if(event.key==='Enter') this.blur()"
                    onclick="event.stopPropagation()"
                    class="w-10 text-center bg-transparent font-black text-amber-600 dark:text-amber-400 focus:outline-none focus:bg-amber-500/10 rounded py-0.5 text-xs selectable-text"
                  />
                  <button onclick="increment(${index}, event)" class="w-6 h-6 rounded-lg bg-white dark:bg-zinc-700 hover:bg-slate-200 dark:hover:bg-zinc-600 text-slate-700 dark:text-zinc-200 font-bold flex items-center justify-center shadow-sm transition-colors text-xs">
                    +
                  </button>
                </div>
              </div>

              <!-- 下排：已拾取數量控制器 (只能手動 +- 與輸入) -->
              <div class="flex items-center justify-between w-full bg-slate-100 dark:bg-zinc-800/80 rounded-xl p-1 border ${isCompleted ? 'border-emerald-500/60 bg-emerald-500/10' : 'border-slate-200 dark:border-zinc-700/60'}">
                <span class="text-[10px] font-black text-emerald-600 dark:text-emerald-400 pl-1 select-none">${dict.foundLabel}</span>
                <div class="flex items-center gap-1">
                  <button onclick="zeroFoundCount(${index}, event)" class="w-6 h-6 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-600 dark:text-red-400 font-bold flex items-center justify-center transition-colors text-xs" title="${dict.zeroTitle}">
                    ↺
                  </button>
                  <button onclick="decrementFound(${index}, event)" class="w-6 h-6 rounded-lg bg-white dark:bg-zinc-700 hover:bg-slate-200 dark:hover:bg-zinc-600 text-slate-700 dark:text-zinc-200 font-bold flex items-center justify-center shadow-sm transition-colors text-xs">
                    -
                  </button>
                  <input 
                    type="number" 
                    min="0"
                    max="999"
                    value="${foundCount}" 
                    onchange="handleFoundInputChange(${index}, this.value)"
                    onkeydown="if(event.key==='Enter') this.blur()"
                    onclick="event.stopPropagation()"
                    class="w-10 text-center bg-transparent font-black text-emerald-600 dark:text-emerald-400 focus:outline-none focus:bg-emerald-500/10 rounded py-0.5 text-xs selectable-text"
                  />
                  <button onclick="incrementFound(${index}, event)" class="w-6 h-6 rounded-lg bg-white dark:bg-zinc-700 hover:bg-slate-200 dark:hover:bg-zinc-600 text-slate-700 dark:text-zinc-200 font-bold flex items-center justify-center shadow-sm transition-colors text-xs">
                    +
                  </button>
                </div>
              </div>
            </div>
          ` : ''}
        `;

        container.appendChild(card);
      });

      updateHighlights();
      renderTransitBar();
      applyLanguage();
      saveState();
    }

    // 點擊卡片底部的地圖標籤處理
    function toggleMapTransit(mapName, event) {
      if (event) event.stopPropagation();

      const lastMap = transitPath[transitPath.length - 1];
      if (lastMap === mapName) {
        transitPath.pop();
      } else {
        transitPath.push(mapName);
      }

      renderCards();
    }

    // 撤銷最後一個轉移節點
    function undoTransitStep() {
      if (transitPath.length > 0) {
        transitPath.pop();
        renderCards();
      }
    }

    // 清空轉移路線
    function clearTransitPath() {
      transitPath = [];
      renderCards();
    }

    // 從轉移鏈中移除指定索引節點
    function removeTransitNode(nodeIndex) {
      transitPath.splice(nodeIndex, 1);
      renderCards();
    }

    // 判斷轉移 Map A -> Map B 是否合法
    function canTransit(fromMap, toMap) {
      if (!fromMap || !toMap) return false;
      const validNeighbors = VALID_TRANSITS[fromMap];
      return validNeighbors ? validNeighbors.includes(toMap) : false;
    }

    // 渲染轉移路線條
    function renderTransitBar() {
      const dict = i18n[currentLang];
      const container = document.getElementById('transit-flow-container');
      const badge = document.getElementById('transit-status-badge');

      if (!transitPath || transitPath.length === 0) {
        container.innerHTML = `
          <div class="text-xs text-slate-400 dark:text-zinc-500 py-2 px-1 flex items-center gap-2 italic">
            <span>${dict.emptyRouteGuide}</span>
          </div>
        `;
        badge.className = "px-2.5 py-0.5 rounded-full text-xs font-black bg-slate-200 text-slate-700 dark:bg-zinc-800 dark:text-zinc-400";
        badge.innerText = dict.noRouteBuilt;
        return;
      }

      let html = '';
      let isFullRouteValid = true;
      let invalidCount = 0;

      transitPath.forEach((map, index) => {
        html += `
          <div onclick="removeTransitNode(${index})" 
               title="${dict.clickToRemoveNode}" 
               class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-500/20 hover:bg-red-500/20 border border-emerald-500 hover:border-red-500 text-emerald-600 dark:text-emerald-300 hover:text-red-500 dark:hover:text-red-400 font-bold text-xs shadow-md shadow-emerald-500/10 shrink-0 cursor-pointer transition-all group">
            <span class="bg-emerald-500 group-hover:bg-red-500 text-zinc-950 group-hover:text-white font-black text-[10px] w-4 h-4 rounded-full flex items-center justify-center transition-colors">${index + 1}</span>
            <span>${map}</span>
            <span class="ml-1 text-emerald-400 group-hover:text-red-500 font-black text-xs transition-colors">✕</span>
          </div>
        `;

        if (index < transitPath.length - 1) {
          const nextMap = transitPath[index + 1];
          const isValid = canTransit(map, nextMap);

          if (!isValid) {
            isFullRouteValid = false;
            invalidCount++;
          }

          if (isValid) {
            html += `
              <div class="flex flex-col items-center justify-center px-1 shrink-0 group">
                <span class="text-[9px] text-emerald-500 font-black tracking-tighter uppercase">${dict.canTransit}</span>
                <div class="flex items-center">
                  <div class="h-0.5 w-6 bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]"></div>
                  <svg class="w-4 h-4 text-emerald-500 -ml-1" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
                  </svg>
                </div>
              </div>
            `;
          } else {
            html += `
              <div class="flex flex-col items-center justify-center px-1 shrink-0 group" title="${map} ➔ ${nextMap}">
                <span class="text-[9px] text-rose-500 font-black tracking-tighter uppercase">${dict.cannotTransit}</span>
                <div class="flex items-center">
                  <div class="h-0.5 w-4 bg-rose-500 animate-pulse"></div>
                  <div class="w-5 h-5 rounded-full bg-rose-600 text-white font-black text-[10px] flex items-center justify-center shadow-md shadow-rose-600/50">
                    ✕
                  </div>
                  <div class="h-0.5 w-4 bg-rose-500 animate-pulse"></div>
                  <svg class="w-4 h-4 text-rose-500 -ml-1" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
                  </svg>
                </div>
              </div>
            `;
          }
        }
      });

      container.innerHTML = html;

      // 更新路線狀態標籤
      if (transitPath.length === 1) {
        badge.className = "px-2.5 py-0.5 rounded-full text-xs font-black bg-blue-500/20 text-blue-600 dark:text-blue-400 border border-blue-500/30";
        badge.innerText = `${dict.startPrefix}: ${transitPath[0]} ${dict.selectNextStop}`;
      } else if (isFullRouteValid) {
        badge.className = "px-2.5 py-0.5 rounded-full text-xs font-black bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30 shadow-sm";
        badge.innerText = `${dict.validRoute} (${transitPath.length - 1} ${dict.transitsCount})`;
      } else {
        badge.className = "px-2.5 py-0.5 rounded-full text-xs font-black bg-rose-500/20 text-rose-600 dark:text-rose-400 border border-rose-500/30 shadow-sm animate-pulse";
        badge.innerText = `${dict.invalidRoutePrefix} ${invalidCount} ${dict.invalidRouteSuffix}`;
      }
    }

    function handleSquareClick(index) {
      if (counts[index] === 0) {
        counts[index] = 1;
      } else {
        counts[index]++;
      }
      renderCards();
    }

    function increment(index, event) {
      if (event) event.stopPropagation();
      counts[index]++;
      renderCards();
    }

    function decrement(index, event) {
      if (event) event.stopPropagation();
      if (counts[index] > 0) {
        counts[index]--;
        if (counts[index] === 0) {
          foundCounts[index] = 0;
        }
      }
      renderCards();
    }

    function zeroCount(index, event) {
      if (event) event.stopPropagation();
      counts[index] = 0;
      foundCounts[index] = 0;
      renderCards();
    }

    function handleInputChange(index, value) {
      let val = parseInt(value, 10);
      if (isNaN(val) || val < 0) {
        val = 0;
      }
      counts[index] = val;
      if (val === 0) {
        foundCounts[index] = 0;
      }
      renderCards();
    }

    // 已拾取數量的獨立控制器函數
    function incrementFound(index, event) {
      if (event) event.stopPropagation();
      foundCounts[index]++;
      renderCards();
    }

    function decrementFound(index, event) {
      if (event) event.stopPropagation();
      if (foundCounts[index] > 0) {
        foundCounts[index]--;
      }
      renderCards();
    }

    function zeroFoundCount(index, event) {
      if (event) event.stopPropagation();
      foundCounts[index] = 0;
      renderCards();
    }

    function handleFoundInputChange(index, value) {
      let val = parseInt(value, 10);
      if (isNaN(val) || val < 0) {
        val = 0;
      }
      foundCounts[index] = val;
      renderCards();
    }

    function resetAll() {
      counts.fill(0);
      foundCounts.fill(0);
      transitPath = [];
      renderCards();
    }

    function updateHighlights() {
      const activeMapCounts = {};
      const dict = i18n[currentLang];

      itemsData.forEach((item, index) => {
        if (counts[index] > 0) {
          item.maps.forEach(map => {
            activeMapCounts[map] = (activeMapCounts[map] || 0) + 1;
          });
        }
      });

      const commonMaps = Object.keys(activeMapCounts).filter(map => activeMapCounts[map] >= 2);

      document.querySelectorAll('.map-tag').forEach(tag => {
        const mapName = tag.getAttribute('data-map');
        const cardContainer = tag.closest('.flex-col.bg-white, .flex-col.bg-zinc-900');
        
        const isCardActive = cardContainer && cardContainer.querySelector('.animate-bounce-short');

        if (!transitPath.includes(mapName) && isCardActive && commonMaps.includes(mapName)) {
          tag.classList.add('map-highlight');
        } else {
          tag.classList.remove('map-highlight');
        }
      });

      const banner = document.getElementById('common-targets-bar');
      const mapsList = document.getElementById('common-maps-list');

      if (commonMaps.length > 0) {
        banner.classList.remove('hidden');
        mapsList.innerHTML = commonMaps.map(map => `
          <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-black bg-amber-500 text-zinc-950 shadow-sm">
            ${map} 
            <span class="bg-zinc-950/20 px-1.5 py-0.5 rounded-full text-[10px] font-bold">
              ${activeMapCounts[map]} ${dict.itemsCount}
            </span>
          </span>
        `).join('');
      } else {
        banner.classList.add('hidden');
      }
    }

    function hoverMap(mapName) {
      document.querySelectorAll(`.map-tag[data-map="${mapName}"]`).forEach(tag => {
        tag.classList.add('map-hover-active');
      });
    }

    function unhoverMap() {
      document.querySelectorAll('.map-tag').forEach(tag => {
        tag.classList.remove('map-hover-active');
      });
    }

    function toggleTheme() {
      const html = document.documentElement;
      const sunIcon = document.getElementById('sun-icon');
      const moonIcon = document.getElementById('moon-icon');

      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      } else {
        html.classList.add('dark');
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      }
    }

    // 初始化載入
    window.onload = function() {
      loadState();   // 從 LocalStorage 載入歷史記憶
      renderCards(); // 繪製畫面 :)
      isInitialRender = false; // 首次繪製完畢，啟用達標動畫
    }
  </script>
</body>
</html>
